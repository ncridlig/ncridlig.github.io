name: Compile LaTeX CV

on:
  push:
    branches: [master]
    paths:
      - 'cv/**'
  workflow_dispatch:  # manual trigger too

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Compile CV
        run: |
          cd cv
          pdflatex -interaction=nonstopmode nicolascridligcv.tex
          pdflatex -interaction=nonstopmode nicolascridligcv.tex  # second pass for ToC/refs
          cp nicolascridligcv.pdf ../public/nicolascridligcv.pdf

      - name: Commit PDF to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nicolascridligcv.pdf
          git diff --staged --quiet || git commit -m "Auto-compile CV from LaTeX [skip ci]"
          git push origin master

      - name: Push PDF to main branch
        run: |
          git fetch origin main
          git checkout main
          git checkout master -- public/nicolascridligcv.pdf
          mv public/nicolascridligcv.pdf nicolascridligcv.pdf
          git add nicolascridligcv.pdf
          git diff --staged --quiet || git commit -m "Auto-sync CV PDF from LaTeX [skip ci]"
          git push origin main
