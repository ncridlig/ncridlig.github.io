name: Compile LaTeX CVs

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages (TeX Live ~2GB)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-texlive-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Compile English CV
        run: |
          cd cv
          pdflatex -interaction=nonstopmode nicolascridligcv.tex
          pdflatex -interaction=nonstopmode nicolascridligcv.tex
          cp nicolascridligcv.pdf ../public/nicolascridligcv.pdf

      - name: Compile French CV
        run: |
          cd cv
          pdflatex -interaction=nonstopmode nicolascridligcv-fr.tex
          pdflatex -interaction=nonstopmode nicolascridligcv-fr.tex
          cp nicolascridligcv-fr.pdf ../public/nicolascridligcv-fr.pdf

      - name: Commit updated PDFs
        run: |
          git checkout -- cv/cv-style.sty 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nicolascridligcv.pdf public/nicolascridligcv-fr.pdf
          git diff --staged --quiet || git commit -m "Compile CVs from LaTeX"
          git pull --rebase --autostash origin main
          git push
