name: Compile LaTeX CVs

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended

      - name: Fetch extra LaTeX packages (fast CTAN downloads)
        run: |
          mkdir -p ~/texmf/tex/latex
          cd ~/texmf/tex/latex
          # enumitem — flexible list environments
          wget -q http://mirrors.ctan.org/macros/latex/contrib/enumitem/enumitem.sty
          # needspace — reserve space at page breaks
          wget -q http://mirrors.ctan.org/macros/latex/contrib/needspace/needspace.sty
          texhash ~/texmf

      - name: Compile English CV
        run: |
          cd cv
          pdflatex -interaction=nonstopmode nicolascridligcv.tex
          pdflatex -interaction=nonstopmode nicolascridligcv.tex
          cp nicolascridligcv.pdf ../public/nicolascridligcv.pdf

      - name: Compile French CV
        run: |
          cd cv
          pdflatex -interaction=nonstopmode nicolascridligcv-fr.tex
          pdflatex -interaction=nonstopmode nicolascridligcv-fr.tex
          cp nicolascridligcv-fr.pdf ../public/nicolascridligcv-fr.pdf

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nicolascridligcv.pdf public/nicolascridligcv-fr.pdf
          git diff --staged --quiet || git commit -m "Compile CVs from LaTeX"
          git pull --rebase origin main
          git push
