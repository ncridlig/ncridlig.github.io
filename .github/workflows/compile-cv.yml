name: Compile LaTeX CV

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Compile CV
        run: |
          cd cv
          pdflatex -interaction=nonstopmode nicolascridligcv.tex
          pdflatex -interaction=nonstopmode nicolascridligcv.tex
          cp nicolascridligcv.pdf ../public/nicolascridligcv.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nicolascridligcv.pdf
          git diff --staged --quiet || git commit -m "Compile CV from LaTeX"
          git push
